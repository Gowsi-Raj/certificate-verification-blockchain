<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body{
      font-family: Arial;
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1220;
      color:#fff;
    }
    .card{
      width:520px;
      background:rgba(17,24,39,.85);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:26px;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
    }
    h1{ margin:0 0 8px; font-size:26px; }
    .sub{ opacity:.8; margin-bottom:16px; }
    label{ display:block; margin-top:12px; margin-bottom:6px; opacity:.9; }
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:#0f172a;
      color:#fff;
      outline:none;
    }
    button{
      width:100%;
      margin-top:16px;
      padding:12px;
      border-radius:10px;
      border:none;
      background:#38bdf8;
      color:#001018;
      font-weight:800;
      cursor:pointer;
    }
    .err{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:#5b1212;
      border:1px solid #ff6b6b55;
      color:#ffd3d3;
      display:none;
    }
    .hint{
      margin-top:12px;
      opacity:.8;
      font-size:14px;
    }
    a{ color:#7dd3fc; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Certificate Verification System</h1>
    <div class="sub">Login as <b>ADMIN</b> or <b>STUDENT</b> to view dashboards.</div>

    <label>Username</label>
    <input id="username" placeholder="admin / student" />

    <label>Password</label>
    <input id="password" type="password" placeholder="password" />

    <button onclick="doLogin()">Login</button>

    <div id="err" class="err"></div>

    <div class="hint">
      Public verification page: <a href="/verify">/verify</a>
    </div>
  </div>

<script>
async function doLogin(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;

  const errBox = document.getElementById("err");
  errBox.style.display = "none";
  errBox.innerText = "";

  try{
    const res = await fetch("/api/auth/login", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if(!data.success){
      errBox.style.display = "block";
      errBox.innerText = data.message || "Invalid username or password";
      return;
    }

    // role based redirect
    const role = (data.role || "").toUpperCase();
    if(role === "ADMIN"){
      window.location.href = "/admin/dashboard";
    }else{
      window.location.href = "/student/dashboard";
    }

  }catch(e){
    errBox.style.display = "block";
    errBox.innerText = "Server error. Check backend running.";
  }
}
</script>

</body>
</html>
