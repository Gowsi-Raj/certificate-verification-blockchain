<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Certificate System</title>
  <style>
    body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#e5e7eb;display:grid;place-items:center;height:100vh}
    .card{width:min(420px,92vw);background:#111a2e;border:1px solid #223056;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    h1{margin:0 0 10px;font-size:20px}
    p{margin:0 0 18px;color:#a9b4cc;font-size:13px;line-height:1.4}
    label{display:block;margin:10px 0 6px;font-size:13px;color:#cdd6ea}
    input{width:100%;padding:12px 12px;border-radius:12px;border:1px solid #2a3b69;background:#0e162a;color:#e5e7eb;outline:none}
    input:focus{border-color:#4f8cff}
    .row{display:flex;gap:10px;margin-top:16px}
    button{flex:1;padding:12px;border:none;border-radius:12px;background:#4f8cff;color:#061024;font-weight:700;cursor:pointer}
    button:hover{filter:brightness(1.05)}
    .err{margin-top:12px;background:#3a1014;border:1px solid #7a1f29;color:#ffd5d9;padding:10px;border-radius:12px;font-size:13px}
    .mini{margin-top:14px;color:#a9b4cc;font-size:12px}
    a{color:#7fb1ff}
  </style>
</head>
<body>
  <div class="card">
    <h1>Certificate Verification System</h1>
    <p>Login as <b>ADMIN</b> or <b>STUDENT</b> to view dashboards.</p>

    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" placeholder="admin / student" required />

      <label>Password</label>
      <input name="password" type="password" placeholder="password" required />

      <div class="row">
        <button type="submit">Login</button>
      </div>

      <!-- shows error if controller sends model attribute 'error' -->
      <div class="err" th:if="${error}" th:text="${error}">Invalid username or password</div>
    </form>

    <div class="mini">
      Public verification page: <a href="/verify" target="_blank">/verify</a>
    </div>
  </div>
</body>
</html>
