<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin Dashboard</title>
  <style>
    body{margin:0;background:#0b1020;color:#fff;font-family:Arial;}
    .top{position:sticky;top:0;background:#0b1020;padding:16px 24px;border-bottom:1px solid #1f2a44;display:flex;justify-content:space-between;}
    .box{padding:18px 24px;}
    .card{background:#111a2e;border:1px solid #1f2a44;border-radius:14px;padding:16px;margin-bottom:18px;}
    input,button{padding:10px;border-radius:10px;border:0;margin:6px 0;width:100%;}
    input{background:#0b1225;color:#fff;outline:1px solid #233b6a;}
    button{background:#38bdf8;color:#00111f;font-weight:800;cursor:pointer;}
    table{width:100%;border-collapse:collapse;}
    td,th{border-bottom:1px solid #1f2a44;padding:10px;font-size:14px;vertical-align:top;}
    a{color:#93c5fd}
    img{width:120px;height:120px;border-radius:10px;background:#fff;padding:6px;}
    .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;}
    .msg{padding:10px;border-radius:10px;margin-bottom:10px;background:#134e4a;}
    .err{padding:10px;border-radius:10px;margin-bottom:10px;background:#7f1d1d;}
    .btn-danger{background:#fb7185;color:#2b0b12;}
    .btn-small{padding:8px 10px;border-radius:10px;width:auto;}
  </style>
</head>
<body>

<div class="top">
  <div><b>Admin Dashboard</b></div>
  <div><a href="/admin/logout">Logout</a></div>
</div>

<div class="box">

  <!-- flash messages -->
  <div th:if="${msg}" class="msg" th:text="${msg}"></div>
  <div th:if="${err}" class="err" th:text="${err}"></div>

  <div class="grid">
    <div class="card">
      <h3>Create Certificate</h3>

      <form method="post" action="/admin/certificates/create">
        <input name="studentName" placeholder="Student Name" required />
        <input name="courseName" placeholder="Course Name" required />
        <input name="institutionName" placeholder="Institution Name" required />
        <input name="issueDate" type="date" required />
        <button type="submit">Create</button>
      </form>
    </div>

    <div class="card">
      <h3>All Certificates</h3>

      <table>
        <tr>
          <th>Student</th>
          <th>Course</th>
          <th>Institution</th>
          <th>Issue Date</th>
          <th>Hash</th>
          <th>QR</th>
          <th>Action</th>
        </tr>

        <tr th:each="c : ${certificates}">
          <td th:text="${c.studentName}"></td>
          <td th:text="${c.courseName}"></td>
          <td th:text="${c.institutionName}"></td>
          <td th:text="${c.issueDate}"></td>
          <td>
            <div th:text="${c.certificateHash}"></div>
            <div>
              <a th:href="@{'/verify/' + ${c.certificateHash}}" target="_blank">Open Verify</a>
            </div>
          </td>

          <!-- ✅ QR IMAGE (this is where you add it) -->
          <td>
            <img th:if="${c.qrFilename != null}"
                 th:src="@{'/qrcodes/' + ${c.qrFilename}}"
                 alt="QR"/>
            <span th:if="${c.qrFilename == null}">No QR</span>
          </td>

          <!-- ✅ DELETE BUTTON -->
          <td>
            <form th:action="@{'/admin/certificates/' + ${c.id} + '/delete'}"
                  method="post"
                  onsubmit="return confirm('Delete this certificate?');">
              <button type="submit" class="btn-danger btn-small">Delete</button>
            </form>
          </td>
        </tr>
      </table>

    </div>

  </div>
</div>
</body>
</html>
