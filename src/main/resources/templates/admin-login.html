<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Admin Login</title>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#fff;font-family:Arial;}
    .card{width:360px;background:#111a2e;padding:24px;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);}
    input,button{width:100%;padding:12px;border-radius:10px;border:0;margin-top:10px;}
    input{background:#0b1225;color:#fff;outline:1px solid #233b6a;}
    button{background:#38bdf8;color:#00111f;font-weight:800;cursor:pointer;}
    .err{color:#ff6b6b;margin-top:10px;}
    a{color:#93c5fd}
  </style>
</head>
<body>
<div class="card">
  <h2>Admin Login</h2>
  <form method="post" action="/admin/login">
    <input name="username" placeholder="admin" required/>
    <input name="password" type="password" placeholder="password" required/>
    <button type="submit">Login</button>
  </form>
  <div class="err" th:if="${error}" th:text="${error}"></div>
  <div style="margin-top:12px"><a href="/">Back</a></div>
</div>
</body>
</html>
